<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="A scroll whose written lines turn into a sound waveform">
  <!-- Icon variant of hero.svg. The "HEAR YE" lettering is replaced with
       abstract text bars, because real letterforms turn to mush below ~48px —
       this is the favicon / avatar / npm-listing size. -->
  <rect x="52" y="44" width="136" height="152" rx="8" fill="#F6EAD4"/>
  <rect x="52" y="44" width="136" height="152" rx="8" fill="none" stroke="#D8C4A0" stroke-width="3"/>

  <rect x="42" y="32" width="156" height="24" rx="12" fill="#E0CFA8"/>
  <rect x="42" y="184" width="156" height="24" rx="12" fill="#E0CFA8"/>

  <g fill="#1E3A66">
    <rect x="80" y="82" width="80" height="9" rx="4.5"/>
    <rect x="80" y="104" width="58" height="9" rx="4.5"/>
  </g>

  <g fill="#2B6BE4">
    <rect x="76" y="152" width="8" height="18" rx="4"/>
    <rect x="90" y="144" width="8" height="34" rx="4"/>
    <rect x="104" y="138" width="8" height="46" rx="4"/>
    <rect x="118" y="148" width="8" height="26" rx="4"/>
    <rect x="132" y="141" width="8" height="40" rx="4"/>
    <rect x="146" y="150" width="8" height="22" rx="4"/>
    <rect x="160" y="155" width="8" height="12" rx="4"/>
  </g>
</svg>
